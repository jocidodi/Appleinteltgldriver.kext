name: Build Kext

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Kext
        run: |
          xcodebuild -project AppleIntelTGLController.xcodeproj \
            -configuration Release \
            ARCHS=x86_64 \
            BUILD_DIR=build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES

      - name: Compress Built Kext
        run: |
          cd build/Release
          zip -r AppleintelTGLdriver.kext.zip *.kext || zip -r AppleintelTGLdriver.kext.zip *

      - name: Upload Kext Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleintelTGLdriver-Kext
          path: build/Release/AppleintelTGLdriver.kext.zip
